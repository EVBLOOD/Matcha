services:
  front_prod:
    build: 
      context: .
      dockerfile: docker_prod/front/Dockerfile
      args:
        - VITE_BACKEND_LINK=${VITE_BACKEND_LINK}
        - VITE_SOCKET_LINK=${VITE_SOCKET_LINK}
    image: matcha_prod_front
    container_name: matcha_prod_front
    env_file: .env
    restart: on-failure
    expose:
      - 80
    networks:
      - matcha_prod
    depends_on:
      - back_prod

  back_prod:
    build: 
      context: .
      dockerfile: docker_prod/back/Dockerfile
    image: matcha_prod_back
    container_name: matcha_prod_back
    environment:
      - GEOIP_DB_PATH=/var/www/html/app/data/maxmind/GeoLite2-City.mmdb
    env_file: .env
    restart: on-failure
    volumes:
      - geoip-data:/app/app/data/maxmind:ro
    expose:
      - 8080
    networks:
      - matcha_prod
    depends_on:
      - redis_prod
      - database_prod
      - geoip_updater_prod

  database_prod:
    image: postgres
    container_name: matcha_prod_database
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s
    env_file: .env
    volumes:
      - vol_database_prod:/var/lib/postgresql/18/data
    restart: on-failure
    expose:
      - 5432
    networks:
      - matcha_prod

  redis_prod:
    image: redis:latest
    container_name: matcha_prod_redis
    command: redis-server --appendonly yes
    restart: on-failure
    volumes:
      - redis_data_prod:/data 
    networks:
      - matcha_prod

  geoip_updater_prod:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: matcha_prod_geoip_updater
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=$GEOIPUPDATE_ACCOUNT_ID
      - GEOIPUPDATE_LICENSE_KEY=$GEOIPUPDATE_LICENSE_KEY
      - GEOIPUPDATE_EDITION_IDS=$GEOIPUPDATE_EDITION_IDS
      - GEOIPUPDATE_FREQUENCY=72
    restart: on-failure
    volumes:
      - geoip-data:/usr/share/GeoIP
    networks:
      - matcha_prod
    depends_on:
      - database_prod

  omni_auth_prod:
    build: 
      context: .
      dockerfile: docker_prod/omni_auth/Dockerfile
    image: matcha_prod_omni_auth
    container_name: matcha_prod_omni_auth
    env_file: .env
    restart: on-failure
    volumes:
      - ${PWD}/srcs/omni_auth:/var/www/html
    ports:
      - 4567:4567
    networks:
      - matcha_prod
    depends_on:
      - database_prod
    

  web_prod:
    image: nginx:alpine
    container_name: matcha_prod_web
    restart: always
    volumes:
      - ./docker_prod/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker_prod/nginx/ssl:/etc/nginx/ssl
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        mkdir -p /etc/nginx/ssl
        if [ ! -f /etc/nginx/ssl/cert.pem ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/ssl/key.pem \
            -out /etc/nginx/ssl/cert.pem \
            -subj "/CN=localhost"
        fi
        exec nginx -g "daemon off;"
    ports:
      # - 443:443
      - 1026:443
    networks:
      - matcha_prod
    depends_on:
      - back_prod
      - front_prod

networks:
  matcha_prod:
    driver: bridge

volumes:
  vol_database_prod:
    driver_opts:
      type: 'none'
      o: bind
      device: ${PWD}/database
  redis_data_prod:
  geoip-data:
