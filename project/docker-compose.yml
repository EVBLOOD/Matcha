services:

  adminer:
    image: adminer
    container_name: matcha_adminer
    restart: on-failure
    ports:
      - 8080:8080
    networks:
      - matcha
    depends_on:
      - database

  front:
    build: docker/front
    image: matcha_front
    container_name: matcha_front
    env_file: .env
    restart: on-failure
    volumes:
      - ${PWD}/srcs/front:/var/www/html
    expose:
      - 3000
    networks:
      - matcha
    depends_on:
      - back

  back:
    build: 
      context: .
      dockerfile: docker/back/Dockerfile
    image: matcha_back
    container_name: matcha_back
    environment:
      - GEOIP_DB_PATH=/var/www/html/app/data/maxmind/GeoLite2-City.mmdb
    env_file: .env
    restart: on-failure
    volumes:
      - ${PWD}/srcs/back:/var/www/html
    # - geoip-data:/var/www/html/app/data/maxmind:ro
    expose:
      - 8080
    networks:
      - matcha
    depends_on:
      - redis
      - database
      # - geoip_updater

  database:
    image: postgres
    container_name: matcha_database
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
    env_file: .env
    # volumes:
    #   - vol_database:/var/lib/postgresql/data
    restart: on-failure
    ports:
      - 5432:5432
    networks:
      - matcha

  redis:
    image: redis:latest
    container_name: matcha_redis
    command: redis-server --appendonly yes
    restart: on-failure
    # volumes:
    #   - redis_data:/data 
    ports:
      - 6379:6379
    networks:
      - matcha

  # geoip_updater:
  #   image: ghcr.io/maxmind/geoipupdate:latest
  #   container_name: matcha_geoip_updater
  #   environment:
  #     - GEOIPUPDATE_ACCOUNT_ID=$GEOIPUPDATE_ACCOUNT_ID
  #     - GEOIPUPDATE_LICENSE_KEY=$GEOIPUPDATE_LICENSE_KEY
  #     - GEOIPUPDATE_EDITION_IDS=$GEOIPUPDATE_EDITION_IDS
  #     - GEOIPUPDATE_FREQUENCY=72
  #   restart: on-failure
  #   volumes:
  #     - geoip-data:/usr/share/GeoIP
  #   networks:
  #     - matcha
  #   depends_on:
  #     - database

  omni_auth:
    build: 
      context: .
      dockerfile: docker/omni_auth/Dockerfile
    image: matcha_omni_auth
    container_name: matcha_omni_auth
    env_file: .env
    restart: on-failure
    volumes:
      - ${PWD}/srcs/omni_auth:/var/www/html
    ports:
      - 4567:4567
    networks:
      - matcha
    depends_on:
      - database
    

  web:
    image: nginx:alpine
    container_name: matcha_web
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8081:80
    networks:
      - matcha
    depends_on:
      - back
      - front

networks:
  matcha:
    driver: bridge

