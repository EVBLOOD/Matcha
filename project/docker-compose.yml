services:
  front:
    build: docker/front
    container_name: matcha_front
    image: matcha_front
    networks:
      - matcha
    ports:
      - 3000:3000
    restart: on-failure
    volumes:
      - ${PWD}/srcs/front:/var/www/html
      # - matcha_vol_front:/var/www/html
    env_file: .env

  back:
    build: docker/back
    container_name: matcha_back
    image: matcha_back
    networks:
      - matcha
    ports:
      - 8080:8080
    restart: on-failure
    volumes:
      - ${PWD}/srcs/back:/var/www/html
    env_file: .env

networks:
  matcha:
    driver: bridge

